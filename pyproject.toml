[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stablemimic-replicate"
version = "0.2.0"
description = "Unitree G1 StableMimic reproduction training, evaluation, and export stack"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "torch>=2.4", "gymnasium>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
mujoco = ["mujoco>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
