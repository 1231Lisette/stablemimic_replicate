# StableMimic G1 reproduction configuration.
# Values marked "reproduction choice" are not specified by arXiv:2608.02385.
seed: 42
data_root: /root/gpufree-data/stablemimic_replicate/datasets/lafan1/g1
output_root: /root/gpufree-data/stablemimic_replicate/runs

environment:
  num_envs: 4096
  episode_length_s: 20.0
  physics_dt: 0.005
  decimation: 4
  action_scale: 0.5          # reproduction choice
  action_clip: 100.0         # reproduction choice; effectively unbounded Gaussian action
  tracking_reset_probability: 0.5
  transition_duration_s: 1.5
  recovery_error_timeout_s: 2.0
  # Paper distinguishes persistent active-target error from terminal get-up
  # matching but does not publish either threshold.
  recovery_failure_similarity_threshold: 0.05  # reproduction choice
  recovery_terminal_similarity_threshold: 0.70 # reproduction choice
  tracking_resumption_similarity_threshold: 0.70 # evaluation-only reproduction choice
  recovered_like_height_ratio: 0.8
  # Paper fall criterion. Entering Recovery and nearest-reference matching are
  # reproduction choices needed to train on states reached from Tracking.
  tracking_fall_recovery_enabled: true
  tracking_fall_height_threshold: 0.5
  tracking_fall_tilt_degrees: 60.0
  recovery_match_joint_weight: 1.0
  recovery_match_height_weight: 4.0
  recovery_match_gravity_weight: 2.0
  # Ensure Recovery learns to initiate motion from rest, rather than relying
  # only on velocity inherited from a moving reference frame.
  recovery_static_reset_probability: 0.25
  observation_noise_std: 0.0       # reproduction choice; disabled baseline

# The public files contain repeated falls/get-ups. Treating each 102--168 s
# file as one trajectory gives it one wrong terminal target, so split it first.
recovery_segmentation:
  enabled: true
  fallen_height_threshold: 0.5
  fallen_tilt_degrees: 60.0
  upright_height_threshold: 0.7
  upright_tilt_degrees: 30.0
  hold_time_s: 0.5
  maximum_clip_duration_s: 20.0
  # The fall detector fires before ground contact. Keep only the actual
  # tilted-nadir-to-upright portion as the Recovery reference.
  trim_to_tilted_nadir: true

reset_noise:
  root_xy: [-0.05, 0.05]
  root_z: [-0.01, 0.01]
  roll_pitch: [-0.1, 0.1]
  yaw: [-0.2, 0.2]
  linear_velocity_xy: [-0.5, 0.5]
  linear_velocity_z: [-0.2, 0.2]
  angular_velocity_roll_pitch: [-0.52, 0.52]
  angular_velocity_yaw: [-0.78, 0.78]
  joint_position: [-0.1, 0.1]

reward:
  # All kernel weights/sigmas are reproduction choices; the paper publishes
  # the six error families but not their numerical values.
  root_position: {weight: 1.0, sigma: 0.20}
  root_orientation: {weight: 1.0, sigma: 0.35}
  body_position: {weight: 2.0, sigma: 0.15}
  body_orientation: {weight: 1.0, sigma: 0.40}
  body_linear_velocity: {weight: 0.5, sigma: 1.00}
  body_angular_velocity: {weight: 0.5, sigma: 2.00}
  recovery_multiplier: 2.5
  success_bonus: 1.0          # reproduction choice; paper includes r_success but omits its coefficient
  action_rate_penalty: -0.01
  torque_penalty: -0.00002
  power_penalty: -0.00001
  joint_limit_penalty: -1.0

model:
  history_length: 4
  expert_hidden_dims: [512, 256, 128]
  gate_hidden_dims: [256, 128]  # reproduction choice
  critic_hidden_dims: [512, 256, 128]  # reproduction choice
  activation: elu
  initial_std: 0.2         # reproduction choice; paper publishes learned scalar std, not initialization

ppo:
  rollout_steps: 24
  epochs: 5
  minibatches: 4
  learning_rate: 0.001
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_clip: 0.2
  value_loss_coefficient: 1.0
  entropy_coefficient: 0.05
  max_grad_norm: 1.0
  target_kl: 0.01          # reproduction choice for adaptive LR rule
  gate_ce_coefficient: 0.1
  transition_coefficient: 4.0  # transition-sample weight for Gate cross-entropy
  consistency_coefficient: 0.01
  alignment_coefficient: 0.01
  normalize_advantage: true

training:
  max_iterations: 10000
  checkpoint_interval: 100
  log_interval: 10
  # Joint-training reproduction curriculum: Recovery resets stay active from
  # iteration 1; only uncommanded Tracking-fall switching is delayed/ramped.
  # Do not introduce live Tracking falls until the no-push, static Recovery
  # baseline has had enough joint-training exposure to stand reliably.
  fall_recovery_warmup_iterations: 300
  fall_recovery_ramp_iterations: 100
